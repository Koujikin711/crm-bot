<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    try {
      if (window.matchMedia("(min-width:769px)").matches && localStorage.getItem("crm_sidebar_collapsed") === "1")
        document.documentElement.classList.add("sidebar-collapsed");
    } catch (e) {}
  </script>
  <title>Справочники — {{ fio or 'CRM' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='online-booking.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">Metodi CRM</span>
      <div class="sidebar-header-actions">
        <a href="{{ url_for('logout') }}" class="logout">Выйти</a>
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Свернуть меню">☰</button>
      </div>
    </div>
    <div class="user-info">
      <strong>{{ fio or 'Пользователь' }}</strong>
      <span class="role">{{ role }} {% if sphere != '—' %}({{ sphere }}){% endif %}</span>
    </div>
    <nav class="sidebar-nav">
      {% for item in menu %}
      <a href="{{ item.href }}" class="nav-item {% if item.href == '/online-booking/dictionaries' %}active{% endif %}">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-text">{{ item.text }}</span>
      </a>
      {% endfor %}
    </nav>
  </aside>

  <main class="content">
    <h1>Справочники</h1>
    <div class="dict-grid">
      <section class="panel">
        <h2>Направления</h2>
        <form id="dir-form" class="inline-form">
          <input id="dir-name" placeholder="Название" required>
          <input id="dir-duration" type="number" min="10" step="5" value="30" required>
          <button type="submit">Добавить</button>
        </form>
        <div id="dir-list" class="list"></div>
      </section>

      <section class="panel">
        <h2>Специалисты</h2>
        <form id="spec-form" class="inline-form">
          <input id="spec-name" placeholder="ФИО" required>
          <select id="spec-direction" required></select>
          <input id="spec-phone" placeholder="Телефон">
          <button type="submit">Добавить</button>
        </form>
        <div id="spec-list" class="list"></div>
      </section>
    </div>
    <p id="dict-msg" class="hint"></p>
  </main>
  <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
  <script src="{{ url_for('static', filename='online-booking-dicts.js') }}"></script>
</body>
</html>
