<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн запись — {{ fio or 'CRM' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='online-booking.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">Metodi CRM</span>
      <a href="{{ url_for('logout') }}" class="logout">Выйти</a>
    </div>
    <div class="user-info">
      <strong>{{ fio or 'Пользователь' }}</strong>
      <span class="role">{{ role }} {% if sphere != '—' %}({{ sphere }}){% endif %}</span>
    </div>
    <nav class="sidebar-nav">
      {% for item in menu %}
      <a href="{{ item.href }}" class="nav-item {% if item.href == '/online-booking' %}active{% endif %}">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-text">{{ item.text }}</span>
      </a>
      {% endfor %}
    </nav>
  </aside>

  <main class="content booking-layout">
    <section class="panel queue-panel">
      <h2>Ожидают записи</h2>
      <input id="queue-search" type="text" placeholder="Поиск по имени/телефону">
      <div id="queue-list" class="list"></div>
    </section>

    <section class="panel calendar-panel">
      <div class="toolbar">
        <label>Дата: <input id="date-filter" type="date"></label>
        <label>Специалист:
          <select id="specialist-filter"></select>
        </label>
        <button id="refresh-btn">Обновить</button>
      </div>
      <h2>Календарь записей</h2>
      <div id="appointments-list" class="list"></div>
    </section>

    <section class="panel form-panel">
      <h2>Создать запись</h2>
      <form id="booking-form">
        <input type="hidden" id="lead_phone">
        <label>Пациент
          <input id="patient_name" required>
        </label>
        <label>Телефон
          <input id="patient_phone" required>
        </label>
        <label>Направление
          <select id="direction_id" required></select>
        </label>
        <label>Специалист
          <select id="specialist_id" required></select>
        </label>
        <label>Дата и время
          <input id="start_at" type="datetime-local" required>
        </label>
        <label>ID ответственного менеджера
          <input id="responsible_manager_id" type="number">
        </label>
        <label>Комментарий
          <textarea id="comment" rows="3"></textarea>
        </label>
        <button type="submit">Записать пациента</button>
      </form>
      <p id="form-msg" class="hint"></p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='online-booking.js') }}"></script>
</body>
</html>
