<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Metodi CRM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #eee;
    }
    .card {
      background: rgba(255,255,255,0.06);
      padding: 2rem 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; opacity: 0.85; font-size: 0.95rem; }
    .error { color: #ff6b6b; font-size: 0.9rem; margin-bottom: 1rem; }
    .telegram-login { margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Metodi CRM</h1>
    <p>Войдите через Telegram — откроется личный кабинет с меню по вашей роли.</p>
    {% if request.args.get('error') == 'not_found' %}
      <p class="error">Вас нет в базе CRM. Обратитесь к администратору.</p>
    {% elif request.args.get('error') %}
      <p class="error">Ошибка входа. Попробуйте снова.</p>
    {% endif %}
    <div class="telegram-login">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="{{ bot_username }}"
        data-size="large"
        data-auth-url="{{ auth_url }}"
        data-request-access="write">
      </script>
    </div>
  </div>
</body>
</html>
